# Lint the installer scripts, then run install.sh twice on macOS and Ubuntu:
# the second run proves reruns are safe and leave shell startup files unchanged.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        # Settings come from .shellcheckrc. -x lets install.sh follow the modules it sources.
        run: |
          shellcheck --version
          git ls-files -z '*.sh' bin/dot | xargs -0 shellcheck -x
      - name: Kanata config parses
        # The same Kanata release install.sh pins on the Mac (and winget ships on Windows).
        run: |
          curl -fsSL https://github.com/jtroo/kanata/releases/download/v1.12.0/linux-binaries-x64.zip -o "$RUNNER_TEMP/kanata.zip"
          echo "0bedd91567c5d7c54679061baadc37e4f83fb71750003999bc1d11f2c9754f36  $RUNNER_TEMP/kanata.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/kanata.zip" kanata_linux_x64 > "$RUNNER_TEMP/kanata"
          chmod +x "$RUNNER_TEMP/kanata"
          "$RUNNER_TEMP/kanata" --check -c config/kanata/kanata.kbd
          # The Mac copy, with a keyboard name filled in the way scripts/install/keyboard-macos.sh does.
          sed 's/;; @macos-keyboards@/macos-dev-names-include ("CI keyboard") macos-continue-if-no-devs-found yes/' \
            config/kanata/kanata.kbd > "$RUNNER_TEMP/kanata-mac.kbd"
          grep -q 'macos-dev-names-include' "$RUNNER_TEMP/kanata-mac.kbd"
          "$RUNNER_TEMP/kanata" --check -c "$RUNNER_TEMP/kanata-mac.kbd"
          # The macOS-only block (Alt/Command swap), which a Linux check skips: parsed here as
          # if it were for Linux.
          sed -e 's/(platform (macos)/(platform (linux)/' -e 's/(platform (win winiov2 wintercept linux)/(platform (win)/' \
            "$RUNNER_TEMP/kanata-mac.kbd" > "$RUNNER_TEMP/kanata-mac-blocks.kbd"
          grep -q '(platform (linux)' "$RUNNER_TEMP/kanata-mac-blocks.kbd"
          "$RUNNER_TEMP/kanata" --check -c "$RUNNER_TEMP/kanata-mac-blocks.kbd"
          # The ROG config with no ROG keyboard listed: every keyboard but the built-in one.
          sed 's|;; @macos-keyboards@|macos-dev-names-exclude ("Apple Internal Keyboard / Trackpad") macos-continue-if-no-devs-found yes|' \
            config/kanata/kanata.kbd > "$RUNNER_TEMP/kanata-mac-exclude.kbd"
          "$RUNNER_TEMP/kanata" --check -c "$RUNNER_TEMP/kanata-mac-exclude.kbd"
          # The built-in keyboard's own config, bare and with its name filled in.
          "$RUNNER_TEMP/kanata" --check -c config/kanata/builtin.kbd
          sed 's|;; @macos-keyboards@|macos-dev-names-include ("Apple Internal Keyboard / Trackpad") macos-continue-if-no-devs-found yes|' \
            config/kanata/builtin.kbd > "$RUNNER_TEMP/builtin-mac.kbd"
          grep -q 'macos-dev-names-include' "$RUNNER_TEMP/builtin-mac.kbd"
          "$RUNNER_TEMP/kanata" --check -c "$RUNNER_TEMP/builtin-mac.kbd"
      - name: Both Kanata configs have the same layer
        run: |
          layer_rows() { awk '/^\(deflayer code/ { on = 1; next } on && /^\)/ { exit } on && !/^[ _]*$/ { print }' "$1"; }
          diff <(layer_rows config/kanata/kanata.kbd) <(layer_rows config/kanata/builtin.kbd)
          [[ "$(layer_rows config/kanata/builtin.kbd | wc -l)" -eq 3 ]]

  install:
    name: install (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The installer picks bash or zsh startup files from SHELL.
      SHELL: /bin/${{ matrix.shell }}
      # Homebrew's own switch for unattended installs (it also honors CI).
      NONINTERACTIVE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: First install
        run: bash install.sh

      - name: Save shell startup files and configs
        run: bash .github/ci/snapshot.sh "$RUNNER_TEMP/first-run"

      - name: Second install (rerun)
        run: bash install.sh

      - name: Rerun changed nothing
        run: |
          bash .github/ci/snapshot.sh "$RUNNER_TEMP/second-run"
          diff -r "$RUNNER_TEMP/first-run" "$RUNNER_TEMP/second-run"
          echo 'Second run left startup files and configs unchanged.'

      - name: Smoke checks
        timeout-minutes: 20
        run: bash .github/ci/smoke.sh
